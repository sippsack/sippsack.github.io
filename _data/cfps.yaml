# Ideen für künftige Einreichungen (werden auf /cfps/ nicht angezeigt)
# title:  Arbeitstitel (Pflicht)
# format: "Vortrag", "Workshop" oder "Vortrag/Workshop" (weglassen = noch offen)
# co-speaker: Name des Mit-Sprechers (optional, wie in portfolio.yaml)
# notes:  Freitext, Hintergrund, Mitstreiter, Abgrenzung
# links:  Liste von Quellen/Inspirationen
ideas:
  - title: Metriken
    format: Workshop
    co-speaker: Markus Harrer
    notes: Summit-Workshop. Wie sind Metriken aufgebaut, wie können wir sie selbst implementieren? ChatGPT, Probleme von Metriken, Codescene.io
  - title: "Gatherers: Java Stream Gatherers"
  - title: JBang
    links:
      - https://www.youtube.com/watch?v=U4y7rIMXIj0
  - title: 80 % Testcoverage - reicht das schon?
    notes: Test-Coverage ist keine gute Metrik, was brauchen wir noch (Teile aus Vortrag von Roland und mir plus Property Based Testing und Mutation Testing)
  - title: Architektur-Haiku
    links:
      - https://www.neverletdown.net/2015/03/architecture-haiku.html
  - title: Präsentieren leicht gemacht
    notes: Ideen/Tipps aus Presentation Zen
  - title: Softwarearchitekturdiagramme am Real World Szenario
  - title: Functional Java revisited
  - title: DDD Konzepte sichtbar machen und reviewen
    notes: >-
      Habe noch eine neue Idee zu DDD, können wir mal für später im Hinterkopf behalten. Würde auch LASR beinhalten.
      Weiss aber noch nicht, ob es gut passt. Die Idee ist, DDD Konzepte im Code sichtbar zu machen. Da gibt es
      Bibliotheken wie ContextMapper, xMolecules, ggf. ArchUnit und jQAssistant so als Art Fitness Functions.
      Und dazu würde dann LASR als leichtgewichtige Reviewmethode passen
  - title: Samman Coaching Learning Hours
    notes: Eher einzelne Methoden vorstellen, nicht unbedingt das Coaching an sich (das nur kurz erklären), ggf. einzelne Themen für Clean Code Workshop
  - title: hexagonale Architektur explained
    notes: '"Wenn hexagonale Architektur die Lösung, was war eigentlich die Frage?" mit Exkurs in Richtung Softwarearchitektur bringen, also in Richtung Qualitätsziele des Softwaresystems'
  - title: Migrationen mit OpenRewrite
  - title: FFDD - Fitness Function Driven Development
    links:
      - https://www.thoughtworks.com/insights/articles/fitness-function-driven-development
  - title: Modernisierung von Java-Anwendungen
  - title: "Überzeuge die Skeptiker: explizite Architekturarbeit sollte nicht optional sein"
  - title: Design Patterns revisited
    format: Vortrag/Workshop
    notes: Mit Übungen (wichtigste Patterns, Patterns implementieren, ...), ggf. mit SOLID, ...
  - title: Design Patterns funktional gedacht
    links:
      - https://chatgpt.com/c/6a3252a7-eff0-83eb-a249-cdba5ec70668
  - title: Learning by Speaking - Erfahrungen aus 20 Jahren Konferenztourismus
    links:
      - https://chatgpt.com/c/6a3260b8-1398-83ed-9394-0d782d487e1f

