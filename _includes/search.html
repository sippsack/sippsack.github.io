<dialog id="site-search" data-baseurl="{{ site.baseurl | escape }}" aria-labelledby="search-heading">
  <div class="search-dialog-header">
    <h2 id="search-heading">Suche</h2>
    <button id="search-close" type="button" aria-label="Suche schließen"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
  </div>
  <form role="search" id="search-form">
    <label for="search-query">Suchbegriff</label>
    <div class="search-fields">
      <input id="search-query" name="q" type="search" placeholder="Zum Beispiel Java, Architektur oder Virtual Threads" autocomplete="off" aria-controls="search-results" />
      <button type="submit" aria-label="Suchen"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i></button>
    </div>
    <label for="search-type">Inhalte</label>
    <select id="search-type" name="type">
      <option value="">Alle Inhalte</option>
      <option value="Vortragsthema">Vortragsthemen</option>
      <option value="Workshop">Workshops</option>
      <option value="Auftritt">Konferenz- und Usergroup-Auftritte</option>
      <option value="Artikel">Artikel und Veröffentlichungen</option>
    </select>
  </form>
  <p class="search-hint">Die Suche erfolgt ausschließlich in deinem Browser. Mehrere Wörter grenzen die Treffer ein.</p>
  <p id="search-status" role="status" aria-live="polite"></p>
  <ul id="search-results" class="search-results"></ul>
</dialog>
